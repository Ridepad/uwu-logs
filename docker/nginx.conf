map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Combat logs can be large. The browser uploader chunks files, but keep
    # enough headroom for direct/manual requests as well.
    client_max_body_size 2g;

    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Local PvE Ladder WebSocket (FastAPI / port 5040).  Keeping it on the
    # same public origin avoids the upstream hard-coded wss://:8765 endpoint.
    location = /ws/ladder {
        proxy_http_version 1.1;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://ladder:5040/ws/ladder;
    }

    # Upload service (FastAPI / port 5010)
    location = /upload {
        proxy_request_buffering off;
        proxy_pass http://upload:5010;
    }

    location = /upload_progress {
        proxy_pass http://upload:5010;
    }

    # Top/character/statistics service (FastAPI / port 5020)
    location ~ ^/(top|top_points|top_speedrun|pve_stats|character|rank)(/|$) {
        proxy_pass http://top:5020;
    }

    # Gear/cache service used by the character UI (FastAPI / port 5030)
    location ~ ^/(gear|missing)(/|$) {
        proxy_pass http://gear:5030;
    }

    # Flask owns the shared static assets and all report pages.
    location ^~ /static/ {
        proxy_pass http://main:5000;
    }

    # The Flask-only /favicon.ico route is registered only when Z_SERVER.py is
    # executed directly; Gunicorn imports the app, so serve the static icon.
    location = /favicon.ico {
        proxy_pass http://main:5000/static/favicon.ico;
    }

    # Main UwU Logs application (Flask / port 5000)
    location / {
        proxy_pass http://main:5000;
    }
}
